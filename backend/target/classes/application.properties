# ============================================================
# Voice Inventory Backend - Application Configuration
# ============================================================

spring.application.name=voice-inventory-backend
server.port=8088

# ---- MySQL (created via MySQL Workbench using database/schema.sql) ----
spring.datasource.url=jdbc:mysql://localhost:3306/voice_inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Charan_@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# validate: schema.sql (run manually in Workbench) is the source of truth.
# Switch to 'update' if you want Hibernate to auto-manage the schema instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- CORS: allow the Vite dev server / built frontend ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null
